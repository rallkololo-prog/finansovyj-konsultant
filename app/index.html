<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Финансовый консультант</title>
<meta name="theme-color" content="#f3f1ec">
<meta name="description" content="Разбор банковских выписок Т-Банка и Сбера: привычки, подписки, экономия. Данные не покидают устройство.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Финансы">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">₽</div>
      <div>
        <div class="brand-title">Финансовый<br>консультант</div>
        <div class="brand-sub" id="brandSub">ваши выписки</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-note" id="dataNote"></div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div>
        <div class="crumb" id="crumb">Обзор</div>
        <h1 id="pageTitle">Обзор</h1>
      </div>
      <div class="top-right">
        <div class="period-pill" id="periodPill"></div>
      </div>
    </header>
    <div id="view"></div>
    <footer class="foot">
      Все расчёты построены только на операциях из выписки. Банковская выписка не знает, что было куплено,
      поэтому категории — это предположения по названиям магазинов, а не факты.
    </footer>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h3 id="modalTitle">Операции</h3>
        <div class="modal-sub" id="modalSub"></div>
      </div>
      <button class="icon-btn" id="modalClose" aria-label="Закрыть">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="tip" id="tip" hidden></div>

<script src="pdfread.js"></script>
<script src="classify.js"></script>
<script src="import.js"></script>
<script src="data/data.js"></script>
<script src="bootstrap.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script src="pwa.js"></script>
</body>
</html>
