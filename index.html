<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Куда уходят деньги — разбор выписок Т-Банка и Сбера</title>
<meta name="theme-color" content="#f3f1ec">
<meta name="description" content="Разбор банковских выписок Т-Банка и Сбера: привычки, подписки, экономия. Данные не покидают устройство.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Деньги">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --paper:#f3f1ec;
  --card:#fffdf9;
  --ink:#191813;
  --ink-2:#4a4740;
  --muted:#8a857a;
  --line:#e3ded2;
  --line-2:#efeae0;
  --green:#1c6b58;
  --green-soft:#e4efe9;
  --terra:#b4552a;
  --terra-soft:#f8e9e0;
  --amber:#a8791a;
  --amber-soft:#f8efd8;
  --red:#a8322a;
  --red-soft:#f8e4e1;
  --blue:#2f5f8f;
  --blue-soft:#e5eefa;
  --shadow:0 1px 2px rgba(25,24,19,.04), 0 8px 24px -16px rgba(25,24,19,.25);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1,"lnum" 1;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:inherit}
button{font:inherit}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;max-width:1500px;margin:0 auto}
.side{
  width:250px;flex:0 0 250px;border-right:1px solid var(--line);
  padding:26px 18px 20px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:22px;background:linear-gradient(180deg,#f7f5f0,#f3f1ec)
}
.brand{display:flex;gap:12px;align-items:flex-start}
.brand-mark{
  width:38px;height:38px;border-radius:11px;background:var(--ink);color:#fffdf9;
  display:grid;place-items:center;font-size:19px;font-weight:600;flex:0 0 38px
}
.brand-title{font-size:15px;font-weight:600;line-height:1.2}
.brand-sub{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 11px;border-radius:9px;cursor:pointer;border:0;background:none;
  text-align:left;color:var(--ink-2);font-size:13.5px
}
.nav-item:hover{background:#eae6dd;color:var(--ink)}
.nav-item.active{background:var(--ink);color:#fffdf9}
.nav-item .badge{
  font-size:10.5px;padding:1px 6px;border-radius:20px;background:#e9e4d9;color:var(--ink-2)
}
.nav-item.active .badge{background:rgba(255,255,255,.16);color:#fff}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.side-note{font-size:11.5px;line-height:1.45;color:var(--muted)}
.side-note b{color:var(--ink-2);font-weight:600}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:26px 34px 40px;max-width:1180px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.crumb{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:5px}
h1{font-size:27px;line-height:1.15}
.top-right{display:flex;gap:10px;align-items:center}
.period-pill{display:flex;justify-content:flex-end;flex:1;min-width:0}
.top{flex-wrap:wrap}
.foot{margin-top:34px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:760px;line-height:1.55}

/* ---------- blocks ---------- */
.section{margin:30px 0 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:12px}
.section-head h2{font-size:17px}
.section-head .hint{font-size:12.5px;color:var(--muted);max-width:520px;text-align:right}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow:hidden}
.kpi .label{font-size:12px;color:var(--muted);letter-spacing:.01em}
.kpi .value{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.kpi .value.sm{font-size:21px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:6px}
.kpi .sub b{color:var(--ink-2);font-weight:600}
.kpi.accent{background:linear-gradient(160deg,#1e5b4d,#173f36);color:#f2f6f3;border-color:#173f36}
.kpi.accent .label,.kpi.accent .sub{color:#b9cfc7}
.kpi.accent .sub b{color:#fff}
.kpi.warn{background:var(--terra-soft);border-color:#efd6c8}
.kpi.warn .label{color:#8c4a25}
.kpi.green{background:var(--green-soft);border-color:#d3e6dd}

.note{
  display:flex;gap:12px;padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.55;
  background:var(--amber-soft);border:1px solid #ecdcb4;color:#5f4a14
}
.note .ico{font-size:15px;line-height:1.4}
.note.blue{background:var(--blue-soft);border-color:#cfdff2;color:#254b73}
.note.grey{background:#f0ede4;border-color:#e2ddd0;color:var(--ink-2)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)
}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#faf8f3}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t-muted{color:var(--muted)}
.t-small{font-size:12px}
.clickable{cursor:pointer}
.rowlink{color:inherit;text-decoration:none}
tr.link:hover .name{color:var(--green);text-decoration:underline;text-underline-offset:3px}
.link{cursor:pointer;text-decoration:underline dotted;text-decoration-color:#c9c2b2;text-underline-offset:3px}
.link:hover{color:var(--green);text-decoration-color:var(--green)}
tr.active-row{background:#f6f2e7}
.kpi .value.sm{font-size:19px}

.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:20px;
  background:#efebe1;color:var(--ink-2);white-space:nowrap
}
.chip.green{background:var(--green-soft);color:#1a5a4a}
.chip.red{background:var(--red-soft);color:#8f2a23}
.chip.amber{background:var(--amber-soft);color:#7a5813}
.chip.blue{background:var(--blue-soft);color:#2b527c}
.chip.terra{background:var(--terra-soft);color:#8f4322}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}

.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12px;color:var(--ink-2)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-size:10.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .gridline{stroke:var(--line-2);stroke-width:1}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .bar{transition:opacity .15s}
.chart .bar:hover{opacity:.75}
.spark{height:120px}
.hbar-row{display:grid;grid-template-columns:1fr;gap:4px;margin-bottom:10px}
.hbar-top{display:flex;justify-content:space-between;font-size:12.5px;gap:10px}
.hbar-track{height:7px;background:#eae5da;border-radius:5px;overflow:hidden}
.hbar-fill{height:100%;border-radius:5px;background:var(--green)}

/* ---------- misc ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums}
.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
.three-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.list{display:flex;flex-direction:column}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.list-item:last-child{border-bottom:0}
.list-item .t{font-size:13.5px}
.list-item .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.list-item .a{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}

.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:9px;
  cursor:pointer;font-size:13px
}
.btn:hover{border-color:#cfc8b8;background:#faf8f3}
.btn.active{background:var(--ink);color:#fffdf9;border-color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.seg{display:inline-flex;background:#eae5da;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg .btn{border:0;background:none;border-radius:7px;padding:6px 11px}
.seg .btn.active{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--ink)}

input[type=text],input[type=search],select{
  font:inherit;font-size:13.5px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);color:var(--ink);outline:none;min-width:0
}
input[type=text]:focus,input[type=search]:focus,select:focus{border-color:#b9b2a2;box-shadow:0 0 0 3px #ece7dc}
input[type=range]{accent-color:var(--green);width:100%}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* modal */
.modal{position:fixed;inset:0;background:rgba(25,24,19,.38);backdrop-filter:blur(2px);display:grid;place-items:center;padding:24px;z-index:50}
.modal[hidden]{display:none}
.modal-card{
  background:var(--card);border-radius:16px;max-width:820px;width:100%;max-height:86vh;
  display:flex;flex-direction:column;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);border:1px solid var(--line)
}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 20px 12px;border-bottom:1px solid var(--line-2)}
.modal-head h3{font-size:16px}
.modal-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.modal-body,#modalBody{padding:6px 20px 20px;overflow:auto}
.icon-btn{border:0;background:#efebe1;width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:#e6e0d3}
.tip{
  position:fixed;pointer-events:none;background:var(--ink);color:#fffdf9;font-size:12px;padding:6px 9px;
  border-radius:7px;z-index:99;white-space:nowrap;transform:translate(-50%,-135%)
}

/* insights */
.insight{
  border-left:3px solid var(--green);background:var(--card);border-radius:0 12px 12px 0;
  padding:14px 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)
}
.insight h4{font-size:14px;margin-bottom:6px}
.insight p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.55}
.insight .num{font-weight:600;color:var(--ink)}
.insight.terra{border-left-color:var(--terra)}
.insight.amber{border-left-color:var(--amber)}
.insight.blue{border-left-color:var(--blue)}

.rec{
  display:grid;grid-template-columns:26px 1fr auto;gap:14px;align-items:start;
  padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;
  transition:border-color .15s,transform .15s
}
.rec:hover{border-color:#c8c0ad}
.rec .pri{font-size:12px;font-weight:600;color:var(--muted);padding-top:2px}
.rec .title{font-size:14.5px;font-weight:600;margin-bottom:4px}
.rec .why{font-size:12.5px;color:var(--ink-2);line-height:1.5;max-width:640px}
.rec .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.rec .save{text-align:right}
.rec .save .v{font-size:17px;font-weight:600;white-space:nowrap}
.rec .save .l{font-size:11px;color:var(--muted)}
.rec.hi{border-left:3px solid var(--red)}
.rec.mid{border-left:3px solid var(--amber)}
.rec.lo{border-left:3px solid var(--line)}

.scen-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.scen-result{background:linear-gradient(160deg,#1e5b4d,#173f36);color:#eef5f1;border-radius:14px;padding:20px}
.scen-result .big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:6px 0 2px}
.scen-result .small{font-size:12px;color:#b9cfc7}
.scen-result hr{border:0;border-top:1px solid rgba(255,255,255,.16);margin:16px 0}
.scen-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.cat-pick{display:flex;flex-wrap:wrap;gap:7px}
.cat-pick .btn{font-size:12.5px}
.slider-val{font-size:22px;font-weight:600;letter-spacing:-.02em}


/* --- автоматические находки --- */
.ins{position:relative;padding-left:56px}
.ins-n{position:absolute;left:18px;top:18px;font-size:12px;font-weight:700;color:var(--green);letter-spacing:.06em}
.ins-t{font-size:14px;font-weight:600;margin-bottom:5px;line-height:1.35}
.ins-x{font-size:12.8px;line-height:1.55;color:#3c3a33}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* ---------- период: пресеты + календарь ---------- */
.srcseg{margin-right:2px}
.yearsel{font:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.datebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.datebar .presets{background:#eae5da;border-radius:10px;padding:3px;display:inline-flex;gap:2px;flex-wrap:wrap}
.datebar .presets .btn{border:0;background:none;border-radius:7px;padding:6px 9px;font-size:12px;color:var(--ink-2)}
.datebar .presets .btn.active{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--ink)}
.datebar .dates{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:5px 9px}
.datebar .dates input[type=date]{border:0;background:none;font:inherit;font-size:12.5px;color:var(--ink);
  padding:2px 2px;outline:none;width:118px}
.datebar .dates .dash{color:var(--muted);font-size:12px}
.datebar .rangelbl{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* ---------- рекомендации: прекращённые привычки ---------- */
.rec.done{border-left-color:#9db8ad;background:#f7faf8}
.rec.done .pri{color:#7f9a91}
.rec.done .save .v{color:#5d7a72}

/* ---------- непонятные траты ---------- */
.unk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.unk-name{font-size:14.5px;font-weight:600}
.unk-sum{font-size:15px;font-weight:600;white-space:nowrap}
.unk-body{margin-top:10px;display:grid;gap:6px}
.unk-row{display:grid;grid-template-columns:118px 1fr;gap:10px;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.unk-k{color:var(--muted);font-size:12px}
.unk-row a{color:var(--green)}
.chip.clickable{cursor:pointer;border:1px solid var(--line);background:#faf8f3}
.chip.clickable:hover{background:var(--green-soft);border-color:#c9d9d1}.filters select{max-width:250px}
.filters input[type=number]{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card)}

/* ---------- калькуляторы: месяц, счёт, накопления ---------- */
.inp-num{font:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);color:var(--ink);outline:none;width:130px;text-align:right}
.inp-date{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.inp-num:focus,.inp-date:focus{border-color:#b9b2a2;box-shadow:0 0 0 3px #ece7dc}
.calc-table td{padding:7px 10px;vertical-align:middle}
.calc-table td input[type=text]{width:100%;min-width:150px}
.calc-table td input[type=number]{width:130px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.chk input{accent-color:var(--green);width:15px;height:15px;cursor:pointer}
.bar{height:6px;border-radius:4px;background:#e7e2d6;overflow:hidden;max-width:220px}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.unk-actions{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.unk-actions select{max-width:240px}

.inp-num::placeholder{color:#b8b0a1;font-weight:400}

/* загрузка выписки */
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:34px 20px;border:1.5px dashed #d3cbbc;border-radius:16px;transition:border-color .15s,background .15s}
.dropzone.over{border-color:var(--green);background:#f2f7f4}
.dropicon{width:52px;height:52px;border-radius:14px;background:#eef1ec;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.06em;color:#5b6b60}
.drop-t{font-size:17px;font-weight:600;margin-top:14px}
.kvr{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kvr:last-of-type{border-bottom:0}
.kvr .k{color:var(--ink-2)}
.kvr .v{color:var(--ink);text-align:right}
.btn.ghost{background:transparent}

.drop-banks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.drop-banks .bk{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);white-space:nowrap}
.drop-banks .bk.ok{border-color:#bcd6cb;background:#eaf3ef;color:#1c6b58;font-weight:600}
.drop-banks .bk.no{color:var(--muted);border-style:dashed}

/* ======================= МОБИЛЬНАЯ ВЕРСИЯ (<=720px) =======================
   Блок стоит в самом конце файла: ранние правила с той же специфичностью
   (напр. .unk-row, .ins, .filters select) иначе перебивают мобильные. */
@media (max-width:720px){
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  .shell{display:block}
  .side{display:none}
  .main{padding:14px 13px 26px;max-width:none;width:100%}

  .top{gap:8px;margin-bottom:12px}
  .crumb{font-size:11px;letter-spacing:.05em}
  h1{font-size:21px;line-height:1.15}
  .period-pill{flex:none;width:100%}
  .datebar{gap:8px;justify-content:flex-start;width:100%}
  .datebar .presets{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px;gap:3px}
  .datebar .presets::-webkit-scrollbar{display:none}
  .datebar .presets .btn{flex:0 0 auto;min-height:34px;padding:7px 11px;font-size:12.5px}
  .datebar .yearsel{flex:0 0 auto;min-height:34px;font-size:12.5px}
  .datebar .dates{width:100%;justify-content:space-between;padding:4px 8px}
  .datebar .dates input[type=date]{flex:1;min-width:0;width:auto;font-size:13.5px;min-height:34px}
  .datebar .rangelbl{width:100%;white-space:normal}

  .g2,.g3,.two-col,.three-col,.scen-grid{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .g4 .kpi{padding:11px 12px}
  .g4 .kpi .value{font-size:19px}
  .g4 .kpi .label{font-size:11px}
  .g4 .kpi .sub{font-size:11px;line-height:1.4}

<script>
/* pdfread.js — чтение PDF целиком в браузере (и в Node для проверки).
   Возвращает страницы с позиционированными текстовыми фрагментами:
   [{ p: 1, runs: [{ x, y, sx, sy, t }, ...] }, ...]
   Работает на DecompressionStream('deflate') — без внешних библиотек. */
(function (g) {
  "use strict";

  function latin1(u8) {
    let out = "", CH = 0x8000;
    for (let i = 0; i < u8.length; i += CH) {
      out += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
    }
    return out;
  }
  function bytesOf(str) {
    const a = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) a[i] = str.charCodeAt(i) & 0xff;
    return a;
  }
  async function inflate(u8, raw) {
    const ds = new g.DecompressionStream(raw ? "deflate-raw" : "deflate");
    const writer = ds.writable.getWriter();
    writer.write(u8); writer.close();
    const buf = await new Response(ds.readable).arrayBuffer();
    return new Uint8Array(buf);
  }

  function parseAmount(s) {
    const m = /[-+]?\d+(?:\.\d+)?/.exec(s);
    return m ? parseFloat(m[0]) : null;
  }

  async function read(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    const src = latin1(bytes);
    const objs = new Map();          // num -> строка тела объекта
    const streams = new Map();       // num -> Uint8Array (распакованный stream)

    // 1. все объекты
    const re = /(?<![0-9])(\d+)\s+(\d+)\s+obj\b/g;
    let m;
    while ((m = re.exec(src))) {
      const num = parseInt(m[1], 10);
      const start = re.lastIndex;
      const end = src.indexOf("endobj", start);
      if (end < 0) continue;
      objs.set(num, src.slice(start, end));
    }

    // 2. распаковка всех потоков
    for (const [num, body] of objs) {
      const i = body.indexOf("stream");
      if (i < 0) continue;
      let j = i + 6;
      if (body[j] === "\r" && body[j + 1] === "\n") j += 2;
      else if (body[j] === "\n" || body[j] === "\r") j += 1;
      const k = body.lastIndexOf("endstream");
      if (k < 0 || k <= j) continue;
      const head = body.slice(0, i);
      let slice = body.slice(j, k);
      const lm = /\/Length\s+(\d+)(?!\s+\d+\s+R)/.exec(head);
      if (lm) {
        const L = parseInt(lm[1], 10);
        if (L > 0 && L <= slice.length) slice = slice.slice(0, L);
      } else {
        while (slice.length && (slice.charCodeAt(slice.length - 1) === 10 || slice.charCodeAt(slice.length - 1) === 13 || slice.charCodeAt(slice.length - 1) === 32)) slice = slice.slice(0, -1);
      }
      const raw = bytesOf(slice);
      if (/FlateDecode/.test(head)) {
        try { streams.set(num, await inflate(raw, false)); }
        catch (e) {
          try { streams.set(num, await inflate(raw, true)); }
          catch (e2) { streams.set(num, raw); }
        }
      } else {
        streams.set(num, raw);
      }
    }

    // 3. объекты внутри /ObjStm
    const extra = [];
    for (const [num, body] of objs) {
      if (body.indexOf("/ObjStm") < 0) continue;
      const sb = streams.get(num);
      if (!sb) continue;
      const mn = /\/N\s+(\d+)/.exec(body), mf = /\/First\s+(\d+)/.exec(body);
      if (!mn || !mf) continue;
      const N = parseInt(mn[1], 10), first = parseInt(mf[1], 10);
      const text = latin1(sb);
      const hdr = text.slice(0, first).trim().split(/\s+/).map(Number);
      const pairs = [];
      for (let i = 0; i < Math.min(hdr.length, 2 * N); i += 2) pairs.push([hdr[i], hdr[i + 1]]);
      pairs.forEach((pair, idx) => {
        const start = first + pair[1];
        const end = idx + 1 < pairs.length ? first + pairs[idx + 1][1] : text.length;
        if (!objs.has(pair[0])) extra.push([pair[0], text.slice(start, end)]);
      });
    }
    extra.forEach(([n, b]) => objs.set(n, b));

    // 4. страницы
    function refNum(body, key) {
      const r = new RegExp("/" + key + "\\s+(\\d+)\\s+\\d+\\s+R").exec(body);
      return r ? parseInt(r[1], 10) : null;
    }
    const pages = [];
    function walk(num, depth) {
      if (depth > 40 || num == null) return;
      const b = objs.get(num);
      if (!b) return;
      if (/\/Type\s*\/Page[^s]/.test(b)) { pages.push(num); return; }
      if (/\/Type\s*\/Pages/.test(b)) {
        const km = /\/Kids\s*\[(.*?)\]/s.exec(b);
        if (km) {
          const rr = /(\d+)\s+\d+\s+R/g;
          let k;
          while ((k = rr.exec(km[1]))) walk(parseInt(k[1], 10), depth + 1);
        }
      }
    }
    let cat = null;
    for (const [num, b] of objs) if (/\/Type\s*\/Catalog/.test(b)) { cat = num; break; }
    if (cat) walk(refNum(objs.get(cat), "Pages"), 0);
    if (!pages.length) {
      for (const [num, b] of objs) if (/\/Type\s*\/Page[^s]/.test(b)) pages.push(num);
    }

    // 5. шрифты и CMap
    function parseCMap(sb) {
      const s = latin1(sb), cmap = new Map();
      let blk;
      const reChar = /beginbfchar([\s\S]*?)endbfchar/g;
      while ((blk = reChar.exec(s))) {
        const rr = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]*)>/g;
        let p;
        while ((p = rr.exec(blk[1]))) {
          try { cmap.set(parseInt(p[1], 16), utf16be(p[2])); } catch (e) { }
        }
      }
      const reRange = /beginbfrange([\s\S]*?)endbfrange/g;
      while ((blk = reRange.exec(s))) {
        const rr = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g;
        let p;
        while ((p = rr.exec(blk[1]))) {
          const a = parseInt(p[1], 16), z = parseInt(p[2], 16), base = parseInt(p[3], 16);
          for (let c = a; c <= Math.min(z, a + 4095); c++) cmap.set(c, String.fromCodePoint(base + (c - a)));
        }
      }
      return cmap;
    }
    function utf16be(hex) {
      let out = "";
      for (let i = 0; i + 3 < hex.length + 1; i += 4) {
        const code = parseInt(hex.slice(i, i + 4), 16);
        if (!isNaN(code)) out += String.fromCharCode(code);
      }
      return out;
    }

    const fontCache = new Map();
    function fontInfo(fnum) {
      if (fontCache.has(fnum)) return fontCache.get(fnum);
      const b = objs.get(fnum) || "";
      const info = { cmap: new Map(), w: new Map(), dw: 1000, two: /\/Type0/.test(b) };
      const tu = refNum(b, "ToUnicode");
      if (tu != null && streams.has(tu)) info.cmap = parseCMap(streams.get(tu));
      const dm = /\/DescendantFonts\s*\[\s*(\d+)\s+\d+\s+R/.exec(b);
      if (dm) {
        const db = objs.get(parseInt(dm[1], 10)) || "";
        const dwm = /\/DW\s+(-?\d+(?:\.\d+)?)/.exec(db);
        if (dwm) info.dw = parseFloat(dwm[1]);
        const wm = /\/W\s*\[([\s\S]*?)\]\s*(?:\/|>>)/.exec(db);
        if (wm) {
          const txt = wm[1];
          const seq = [];
          const rr = /\[([^\]]*)\]|(-?\d+(?:\.\d+)?)/g;
          let p;
          while ((p = rr.exec(txt))) {
            if (p[1] != null) seq.push(p[1].trim().split(/\s+/).filter(Boolean).map(Number));
            else if (p[2] != null) seq.push(parseFloat(p[2]));
          }
          let i = 0;
          while (i < seq.length) {
            if (i + 1 < seq.length && Array.isArray(seq[i + 1])) {
              const c = seq[i] | 0;
              seq[i + 1].forEach((w, k) => info.w.set(c + k, w));
              i += 2;
            } else if (i + 2 < seq.length) {
              const a = seq[i] | 0, z = seq[i + 1] | 0, w = seq[i + 2];
              for (let c = a; c <= Math.min(z, a + 4095); c++) info.w.set(c, w);
              i += 3;
            } else break;
          }
        }
      }
      fontCache.set(fnum, info);
      return info;
    }

    function decodeStr(raw, fi) {
      const codes = [];
      if (fi.two) { for (let i = 0; i + 1 < raw.length; i += 2) codes.push((raw[i] << 8) | raw[i + 1]); }
      else { for (let i = 0; i < raw.length; i++) codes.push(raw[i]); }
      let out = "", wid = 0;
      for (const c of codes) {
        out += fi.cmap.get(c) || "";
        wid += (fi.w.has(c) ? fi.w.get(c) : fi.dw) / 1000;
      }
      return [out, wid];
    }

    // 6. токенизатор контент-потока (по байтам latin1-строки)
    function tokenize(s) {
      const out = [];
      let i = 0;
      const n = s.length;
      while (i < n) {
        const ch = s.charCodeAt(i);
        if (ch === 32 || ch === 9 || ch === 13 || ch === 10 || ch === 12 || ch === 0) { i++; continue; }
        if (ch === 37) { const j = s.indexOf("\n", i); i = j < 0 ? n : j + 1; continue; }
        if (ch === 40) {
          let depth = 1, j = i + 1;
          const buf = [];
          while (j < n) {
            const c = s.charCodeAt(j);
            if (c === 92) {
              const nx = s.charCodeAt(j + 1);
              if (nx >= 48 && nx <= 55) {
                let k = j + 1, oc = "";
                while (k < n && oc.length < 3 && s.charCodeAt(k) >= 48 && s.charCodeAt(k) <= 55) {
                  oc += s[k]; k++;
                }
                buf.push(parseInt(oc, 8) & 0xff); j = k; continue;
              }
              const map = { 110: 10, 114: 13, 116: 9, 98: 8, 102: 12 };
              buf.push(map[nx] != null ? map[nx] : nx); j += 2; continue;
            }
            if (c === 40) depth++;
            else if (c === 41) { depth--; if (depth === 0) { j++; break; } }
            buf.push(c); j++;
          }
          out.push(["str", Uint8Array.from(buf)]); i = j; continue;
        }
        if (ch === 60) {
          if (s.charCodeAt(i + 1) === 60) { out.push(["op", "<<"]); i += 2; continue; }
          const j = s.indexOf(">", i);
          if (j < 0) break;
          let hx = s.slice(i + 1, j).replace(/[^0-9A-Fa-f]/g, "");
          if (hx.length % 2) hx += "0";
          out.push(["str", hexBytes(hx)]); i = j + 1; continue;
        }
        if (ch === 62 && s.charCodeAt(i + 1) === 62) { out.push(["op", ">>"]); i += 2; continue; }
        if (ch === 91) { out.push(["op", "["]); i++; continue; }
        if (ch === 93) { out.push(["op", "]"]); i++; continue; }
        if (ch === 47) {
          const mm = /^\/([^\s\[\]<>()\/%{}]*)/.exec(s.slice(i, i + 200));
          if (mm) { out.push(["name", mm[1]]); i += mm[0].length; continue; }
        }
        const mn = /^[+-]?(\d+\.?\d*|\.\d+)/.exec(s.slice(i, i + 60));
        if (mn) { out.push(["num", parseFloat(mn[0])]); i += mn[0].length; continue; }
        const mo = /^[A-Za-z'"*][A-Za-z0-9'"*]*/.exec(s.slice(i, i + 40));
        if (mo) { out.push(["op", mo[0]]); i += mo[0].length; continue; }
        i++;
      }
      return out;
    }
    function hexBytes(hx) {
      const a = new Uint8Array(hx.length / 2);
      for (let i = 0; i < a.length; i++) a[i] = parseInt(hx.substr(i * 2, 2), 16);
      return a;
    }

    function mul(a, b) {
      return [
        a[0] * b[0] + a[1] * b[2], a[0] * b[1] + a[1] * b[3],
        a[2] * b[0] + a[3] * b[2], a[2] * b[1] + a[3] * b[3],
        a[4] * b[0] + a[5] * b[2] + b[4], a[4] * b[1] + a[5] * b[3] + b[5],
      ];
    }

    // 7. страница → фрагменты
    function pageRuns(pnum) {
      const body = objs.get(pnum) || "";
      let res = body;
      const rm = /\/Resources\s+(\d+)\s+\d+\s+R/.exec(body);
      if (rm) res = objs.get(parseInt(rm[1], 10)) || body;

      const fonts = new Map();
      const fm = /\/Font\s*<<([\s\S]*?)>>/.exec(res);
      if (fm) {
        const rr = /\/(\w+)\s+(\d+)\s+\d+\s+R/g;

        const y = Math.round(r.y * 10) / 10;
        if (!rows.has(y)) rows.set(y, []);
        rows.get(y).push(r);
      }
      const ys = Array.from(rows.keys()).sort((a, b) => b - a);
      const lines = ys.map(y => {
        const cells = [[], [], [], [], [], []];
        rows.get(y).sort((a, b) => a.x - b.x).forEach(r => cells[bucket(r.x)].push(r.t));
        return { y, c: cells.map(v => v.join("").trim()) };
      });
      let cur = null;
      for (const { c } of lines) {
        const c0 = c[0];
        if (DATE_RE.test(c0)) {
          if (cur) txs.push(cur);
          cur = { op_date: c0, op_time: "", post_date: c[1], post_time: "", amount: c[2], amount_rub: c[3], desc: c[4], card: c[5] };
        } else if (cur) {
          if (TIME_RE.test(c0) && !cur.op_time) cur.op_time = c0;
          if (TIME_RE.test(c[1]) && !cur.post_time) cur.post_time = c[1];
          if (c[4]) cur.desc = (cur.desc + " " + c[4]).trim();
          if (c[2] && !cur.amount) cur.amount = c[2];
          if (c[3] && !cur.amount_rub) cur.amount_rub = c[3];
          if (c[5] && !cur.card) cur.card = c[5];
        }
      }
      if (cur) txs.push(cur);
    }
    return txs.map(t => {
      const a = num(t.amount_rub) != null ? num(t.amount_rub) : num(t.amount);
      return { op_date: t.op_date, op_time: t.op_time, amount: a, desc: t.desc, currency: t.amount_rub ? "rub" : "orig" };
    }).filter(t => t.amount != null && DATE_RE.test(t.op_date));
  }

  // ---------- Сбер ----------
  function parseSber(pages) {
    const AMT = /^([+-]?)(\d[\d\s\u00a0]*)[.,](\d{2})$/;
    const CODE = /^\d{6}$/;
    const ops = [];
    for (const page of pages) {
      const items = page.runs.filter(r => r.t.indexOf("Продолжение на следующей странице") < 0)
        .slice().sort((a, b) => b.y - a.y);
      const lines = [];
      let cur = [], cy = null;
      for (const r of items) {
        if (cy === null || Math.abs(r.y - cy) <= 3) {
          cur.push(r); if (cy === null) cy = r.y;
        } else {
          lines.push(cur.slice().sort((a, b) => a.x - b.x)); cur = [r]; cy = r.y;
        }
      }
      if (cur.length) lines.push(cur.slice().sort((a, b) => a.x - b.x));

      const pick = (line, lo, hi) => line.filter(r => r.x >= lo && r.x < hi).map(r => r.t).join(" ").trim();
      let op = null;
      for (const line of lines) {
        const d = pick(line, 40, 90), t = pick(line, 90, 140), cat = pick(line, 140, 455);
        const amtTxt = line.filter(r => r.x >= 455).map(r => r.t).join(" ").trim();
        if (DATE_RE.test(d) && TIME_RE.test(t)) {
          let m = AMT.exec(amtTxt.replace(/\u00a0/g, " "));
          if (!m) m = /([+-]?)\s*(\d[\d\s]*)[.,](\d{2})/.exec(amtTxt);
          if (!m) continue;
          const sign = m[1] === "+" ? 1 : -1;
          const value = parseFloat(m[2].replace(/[\s\u00a0]/g, "") + "." + m[3]);
          op = { op_date: d, op_time: t, category_raw: cat, amount: sign * value, desc: "" };
          ops.push(op);
        } else if (op) {
          const pd = pick(line, 40, 90), code = pick(line, 90, 140), desc = pick(line, 140, 620);
          if (desc) op.desc = (op.desc + " " + desc).trim();
        }
      }
    }
    return ops.map(o => {
      let d = o.desc.replace(/\s+/g, " ").trim();
      d = d.replace(/\s*В сумму операции включена комиссия [\d,\s]+руб\.?/g, "").trim();
      return { op_date: o.op_date, op_time: o.op_time, amount: Math.round(o.amount * 100) / 100, desc: d, category_raw: o.category_raw };
    });
  }

  // ---------- сборка FIN ----------
  function toFin(rows, bank) {
    const C = g.CLASSIFY;
    const tx = [];
    for (const r of rows) {
      const info = bank === "sber" ? C.classifySber(r) : C.classifyTb(r);
      const ci = CATS.indexOf(info.c);
      const iso = r.op_date.slice(6, 10) + "-" + r.op_date.slice(3, 5) + "-" + r.op_date.slice(0, 2);
      const [hh, mm] = (r.op_time || "0:0").split(":").map(Number);
      tx.push([iso, hh || 0, mm || 0, Math.round(r.amount * 100) / 100, info.b, ci < 0 ? CATS.indexOf("Прочее") : ci, info.k, info.desc, bank === "sber" ? 1 : 0]);
    }
    tx.sort((a, b) => (a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : (a[1] * 60 + a[2]) < (b[1] * 60 + b[2]) ? 1 : -1));

    const years = {};
    for (const t of tx) {
      const y = t[0].slice(0, 4);
      const cat = CATS[t[5]], kind = t[6], amt = t[3];
      if (!years[y]) years[y] = { spend: 0, cnt: 0, income: 0, invest: 0, p2p: 0, cash: 0 };
      const isSpend = amt < 0 && (kind === "purchase" || kind === "fee");
      if (isSpend) { years[y].spend += -amt; years[y].cnt++; }
      if (amt > 0) years[y].income += amt;
    }
    Object.keys(years).forEach(y => { years[y].spend = Math.round(years[y].spend * 100) / 100; years[y].income = Math.round(years[y].income * 100) / 100; });

    const srcId = bank === "sber" ? "sber" : "tb";
    return rebuild(tx, [{ id: srcId, name: bank === "sber" ? "Сбер" : "Т-Банк", card: "" }]);
  }

  // Пересборка meta/years по готовому массиву операций (для объединения двух банков)
  function rebuild(tx, sources) {
    tx.sort((a, b) => (a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : (a[1] * 60 + a[2]) < (b[1] * 60 + b[2]) ? 1 : -1));
    const years = {};
    for (const t of tx) {
      const y = t[0].slice(0, 4), kind = t[6], amt = t[3];
      if (!years[y]) years[y] = { spend: 0, cnt: 0, income: 0, invest: 0, p2p: 0, cash: 0 };
      if (amt < 0 && (kind === "purchase" || kind === "fee")) { years[y].spend += -amt; years[y].cnt++; }
      if (amt > 0) years[y].income += amt;
    }
    Object.keys(years).forEach(y => {
      years[y].spend = Math.round(years[y].spend * 100) / 100;
      years[y].income = Math.round(years[y].income * 100) / 100;
    });
    const months = Array.from(new Set(tx.map(t => t[0].slice(0, 7)))).sort();
    const from = months[0] + "-01";
    const lastMonth = months[months.length - 1];
    const maxDay = tx.filter(t => t[0].slice(0, 7) === lastMonth).reduce((m, t) => Math.max(m, +t[0].slice(8, 10)), 1);
    const to = lastMonth + "-" + String(maxDay).padStart(2, "0");
    const srcs = sources.map(s => Object.assign({}, s, { count: tx.filter(t => t[8] === (s.id === "sber" ? 1 : 0)).length }));
    // активный период: последние 10 месяцев (как в демо), но не раньше начала данных
    const lastIdx = months.length - 1;
    const actIdx = Math.max(0, lastIdx - 9);
    const active = [months[actIdx] + "-01", to];
    let tx_count = tx.length;
    return {
      meta: {
        categories: CATS, spend_cats: SPEND_CATS, consumption: CONSUMPTION,
        months_all: months, period: [from, to], active: active, sources: srcs,
        tx_count: tx_count, balance: null, imported: true,
      },
      tx, years,
    };
  }

  async function importFile(arrayBuffer, onStep) {
    const step = onStep || (() => { });
    step("читаю PDF…");
    const pages = await g.PDFREAD.read(arrayBuffer);
    step("определяю банк…");
    const bank = detect(pages);
    if (bank === "unknown") {
      throw new Error("Это выписка другого банка. Сейчас поддерживаются только Т-Банк и Сбер.");
    }
    step(bank === "sber" ? "разбираю выписку Сбера…" : "разбираю выписку Т-Банка…");
    const rows = bank === "sber" ? parseSber(pages) : parseTb(pages);
    if (!rows.length) {
      throw new Error("Файл прочитан, но ни одной операции не нашёл. Похоже, это не та выписка: сейчас работают только Т-Банк и Сбер.");
    }
    step("раскладываю по категориям…");
    const fin = toFin(rows, bank);
    return { bank, pages: pages.length, rows: rows.length, fin };
  }

  g.IMPORT = { importFile, detect, parseTb, parseSber, toFin, rebuild, CATS };
  if (typeof module !== "undefined" && module.exports) module.exports = g.IMPORT;
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>
/* bootstrap.js — загружается первым из наших скриптов (после парсеров),
   решает две задачи:
   1) если localStorage недоступен (приватный режим, некоторые webview) — подменяет его
      на память, чтобы приложение работало, а не падало;
   2) подставляет ранее загруженную выписку вместо демонстрационной. */
(function () {
  // 1. безопасное хранилище
  try {
    localStorage.setItem("__fin_test", "1");
    localStorage.removeItem("__fin_test");
  } catch (e) {
    var mem = {};
    window.__LS_MEMORY = true;
    try {
      Object.defineProperty(window, "localStorage", {
        configurable: true,
        value: {
          getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
          setItem: function (k, v) { mem[k] = String(v); },
          removeItem: function (k) { delete mem[k]; },
          clear: function () { mem = {}; },
          key: function (i) { return Object.keys(mem)[i] || null; },
          get length() { return Object.keys(mem).length; }
        }
      });
    } catch (e2) { }
  }

  // 2. сохранённая выписка вместо демо-данных
  try {
    var raw = localStorage.getItem("fin.dataset.v1");
    if (!raw) return;
    var d = JSON.parse(raw);
    if (d && d.tx && d.tx.length && d.meta && d.meta.categories) {
      window.FIN = d;
      window.FIN_IMPORTED = true;
    }
  } catch (e) { console.warn("не удалось прочитать сохранённую выписку", e); }
})();

<script>
/* engine.js — пересчёт аналитики на произвольный период (клиент).
   Порт build_block() из build_data.py: те же формулы, чтобы любые даты в календаре
   давали те же цифры, что и предрасчитанные active/full. */
(function () {
  const FIN = window.FIN;
  const M = FIN.meta;
  const CATS = M.categories;
  const CAT = {};
  CATS.forEach((c, i) => (CAT[c] = i));
  const SPEND_CATS = M.spend_cats;
  const CONSUMPTION = M.consumption;
  const ALL_MONTHS = M.months_all;
  const DAY = 86400000;

  function dt(iso) {
    return Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
  }
  function wd(iso) {
    return (new Date(dt(iso)).getUTCDay() + 6) % 7;
  }

  // подготовка строк один раз
  const ROWS = FIN.tx.map((r, i) => {
    const iso = r[0];
    return {
      id: i, iso, mm: iso.slice(0, 7), t: dt(iso), wd: wd(iso),
      h: r[1], min: r[2], a: r[3], b: r[4], ci: r[5], k: r[6], desc: r[7], src: r[8] || 0,
    };
  });

  const byDate = ROWS.slice().sort((x, y) => x.t - y.t || x.id - y.id);

  function median(vals) {
    if (!vals.length) return 0;
    const s = vals.slice().sort((a, b) => a - b);
    const m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  function cv(vals) {
    const v = vals.filter(x => x > 0);
    if (v.length < 2) return null;
    const mu = v.reduce((s, x) => s + x, 0) / v.length;
    if (!mu) return null;
    const sd = Math.sqrt(v.reduce((s, x) => s + (x - mu) ** 2, 0) / v.length);
    return sd / mu;
  }
  function monthsBetween(from, to) {
    return ALL_MONTHS.filter(mm => mm >= from.slice(0, 7) && mm <= to.slice(0, 7));
  }
  const r2 = x => Math.round(x * 100) / 100;
  const r1 = x => Math.round(x * 10) / 10;

  // overrides: {brand: catName} — подтверждённые пользователем категории
  function computeBlock(from, to, overrides, srcFilter) {
    overrides = overrides || {};
    const ovc = {};
    Object.keys(overrides).forEach(b => {
      const name = overrides[b];
      if (typeof CAT[name] === "number") ovc[b] = CAT[name];
    });
    const catOf = r => (typeof ovc[r.b] === "number" ? ovc[r.b] : r.ci);

    const months = monthsBetween(from, to);
    const days = Math.round((dt(to) - dt(from)) / DAY) + 1;
    const perMonthDiv = days / 30.4375;

    const srcOk = r => !srcFilter || srcFilter === "all" || (srcFilter === "tb" ? r.src === 0 : r.src === 1);
    const inRange = byDate.filter(r => r.iso >= from && r.iso <= to && srcOk(r));
    const spend = inRange.filter(r => (r.k === "purchase" || r.k === "fee") && r.a < 0);

    const catMonth = {}, catCnt = {}, brandMonth = {}, brandCnt = {};
    const brandCat = {}, brandTotal = {}, brandN = {}, brandRows = {}, catVals = {};
    const monthTotal = {}, monthCnt = {}, monthCat = {};
    const wdSum = new Array(7).fill(0), wdCnt = new Array(7).fill(0);
    const hSum = new Array(24).fill(0), hCnt = new Array(24).fill(0);
    const bump = (o, k, v) => { o[k] = (o[k] || 0) + v; };
    const push = (o, k, v) => { (o[k] = o[k] || []).push(v); };

    spend.forEach(r => {
      const amt = -r.a, mm = r.mm, c = catOf(r);
      catMonth[c] = catMonth[c] || {}; catMonth[c][mm] = (catMonth[c][mm] || 0) + amt;
      catCnt[c] = catCnt[c] || {}; catCnt[c][mm] = (catCnt[c][mm] || 0) + 1;
      brandMonth[r.b] = brandMonth[r.b] || {}; brandMonth[r.b][mm] = (brandMonth[r.b][mm] || 0) + amt;
      brandCnt[r.b] = brandCnt[r.b] || {}; brandCnt[r.b][mm] = (brandCnt[r.b][mm] || 0) + 1;
      brandCat[r.b] = c;
      brandTotal[r.b] = (brandTotal[r.b] || 0) + amt;
      brandN[r.b] = (brandN[r.b] || 0) + 1;
      push(brandRows, r.b, { t: r.t, iso: r.iso, amt, id: r.id });
      push(catVals, c, amt);
      monthTotal[mm] = (monthTotal[mm] || 0) + amt;
      monthCnt[mm] = (monthCnt[mm] || 0) + 1;
      monthCat[mm] = monthCat[mm] || {}; monthCat[mm][c] = (monthCat[mm][c] || 0) + amt;
      wdSum[r.wd] += amt; wdCnt[r.wd] += 1;
      if (r.h >= 0) { hSum[r.h] += amt; hCnt[r.h] += 1; }
    });

    const total = Object.keys(brandTotal).reduce((s, b) => s + brandTotal[b], 0);

    const categories = {};
    SPEND_CATS.forEach(c => {
      const ci = CAT[c];
      const vals = catVals[ci] || [];
      const s = vals.reduce((x, y) => x + y, 0);
      const monthly = months.map(mm => r2((catMonth[ci] || {})[mm] || 0));
      categories[c] = {
        total: r2(s), cnt: vals.length,
        avg: vals.length ? r2(s / vals.length) : 0,
        median: r2(median(vals)), max: vals.length ? r2(Math.max.apply(null, vals)) : 0,
        per_month: r2(s / perMonthDiv), per_year: r2(s / perMonthDiv * 12),
        share: total ? r1(s / total * 100) : 0,
        cv: cv(monthly),
        series: monthly,
        counts: months.map(mm => (catCnt[ci] || {})[mm] || 0),
        series_all: ALL_MONTHS.map(mm => r2((catMonth[ci] || {})[mm] || 0)),
      };
    });

    const brands = {};
    Object.keys(brandTotal).forEach(b => {
      const rows = brandRows[b].slice().sort((x, y) => x.t - y.t);
      const gaps = [];
      for (let i = 1; i < rows.length; i++) gaps.push(Math.round((rows[i].t - rows[i - 1].t) / DAY));
      const amts = rows.map(x => x.amt);
      brands[b] = {
        cat: CATS[brandCat[b]], total: r2(brandTotal[b]), cnt: rows.length,
        avg: r2(brandTotal[b] / rows.length), median: r2(median(amts)), max: r2(Math.max.apply(null, amts)),
        gap_med: gaps.length ? r2(median(gaps)) : null,
        cv_amount: cv(amts),
        per_month: r2(brandTotal[b] / perMonthDiv),
        first: rows[0].iso, last: rows[rows.length - 1].iso,
        series: months.map(mm => r2((brandMonth[b] || {})[mm] || 0)),
        counts: months.map(mm => (brandCnt[b] || {})[mm] || 0),
        ids: rows.map(x => x.id),
      };
    });

    // регулярные списания
    const recurring = [];
    Object.keys(brands).forEach(b => {
      const info = brands[b];
      if (info.cnt < 3 || info.cv_amount === null || !info.gap_med) return;
      const g = info.gap_med;
      let period = null;
      if (g >= 25 && g <= 36) period = "месяц";
      else if (g >= 55 && g <= 75) period = "2 месяца";
      else if (g >= 12 && g <= 18) period = "2 недели";
      else if (g >= 6 && g <= 9) period = "неделя";
      else if (g >= 85 && g <= 100) period = "квартал";
      if (!period || info.cv_amount > 0.45) return;
      const perYear = { "неделя": 52, "2 недели": 26, "месяц": 12, "квартал": 4, "2 месяца": 6 }[period];
      recurring.push({
        brand: b, cat: info.cat, period, typical: info.median,
        yearly: r2(info.median * perYear), cnt: info.cnt,
        first: info.first, last: info.last, cv: info.cv_amount,
        total: info.total, ready: months.length < 2 ? true : info.last >= months[months.length - 2],
      });
    });
    recurring.sort((a, b) => b.yearly - a.yearly);

    // мелкие траты
    const small = spend.filter(r => -r.a <= 500 && catOf(r) !== CAT["Комиссии банка"]);
    const smallTotal = small.reduce((s, r) => s + -r.a, 0);
    const smallMonth = {};
    small.forEach(r => { smallMonth[r.mm] = (smallMonth[r.mm] || 0) + -r.a; });
    const byCat = {};
    small.forEach(r => {
      const c = CATS[catOf(r)];
      byCat[c] = (byCat[c] || 0) + -r.a;
    });
    Object.keys(byCat).forEach(c => (byCat[c] = r2(byCat[c])));
    const smallBlock = {
      limit: 500, cnt: small.length, total: r2(smallTotal),
      avg: small.length ? r2(smallTotal / small.length) : 0,
      per_month: r2(smallTotal / perMonthDiv),
      per_year: r2(smallTotal / perMonthDiv * 12),
      per_5y: r2(smallTotal / perMonthDiv * 60),
      per_day: r2(smallTotal / days),
      cnt_per_day: r2(small.length / days),
      share: total ? r1(smallTotal / total * 100) : 0,
      by_cat: byCat,
      series: months.map(mm => r2(smallMonth[mm] || 0)),
      counts: months.map(mm => small.filter(r => r.mm === mm).length),
    };

    const WD = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
    const weekday = WD.map((name, i) => ({
      wd: name, sum: r2(wdSum[i]), cnt: wdCnt[i],
      avg: wdCnt[i] ? r2(wdSum[i] / wdCnt[i]) : 0,
    }));
    const hours = Array.from({ length: 24 }, (_, i) => ({ h: i, sum: r2(hSum[i]), cnt: hCnt[i] }));

    const moy = {};
    months.forEach(mm => {
      const n = +mm.slice(5);
      moy[n] = moy[n] || [0, 0];
      moy[n][0] += monthTotal[mm] || 0;
      moy[n][1] += 1;
    });
    const mood = Array.from({ length: 12 }, (_, i) => ({
      m: i + 1,
      avg: moy[i + 1] ? r2(moy[i + 1][0] / moy[i + 1][1]) : 0,
    }));

    // аномалии
    const anomalies = [];
    CONSUMPTION.forEach(c => {
      const vals = (catVals[CAT[c]] || []);
      if (vals.length < 8) return;
      const mMed = median(vals);
      const logs = vals.map(v => Math.log1p(v));
      const lm = median(logs);
      const mad = median(logs.map(v => Math.abs(v - lm))) || 0.05;
      spend.forEach(r => {
        if (catOf(r) !== CAT[c]) return;
        const amt = -r.a;
        if (amt >= 2500 && amt > Math.max(3 * mMed, mMed + 1500)) {
          anomalies.push({
            id: r.id, date: r.iso, amount: r2(amt), brand: r.b, cat: c,
            median: r2(mMed), ratio: mMed ? r1(amt / mMed) : null,
            score: r1((Math.log1p(amt) - lm) / (1.4826 * mad)),
          });
        }
      });
    });
    anomalies.sort((a, b) => b.amount - a.amount);
    const biggest = anomalies.slice(0, 15);

    const actVals = months.map(mm => monthTotal[mm] || 0).filter(v => v > 0);
    const medMonth = actVals.length ? median(actVals) : 0;
    const spikes = months.filter(mm => medMonth && (monthTotal[mm] || 0) > medMonth * 1.3)
      .map(mm => ({ month: mm, spend: r2(monthTotal[mm]), ratio: r2(monthTotal[mm] / medMonth) }));

    const half = Math.floor(months.length / 2);
    const firstM = new Set(months.slice(0, half)), secondM = new Set(months.slice(half));
    const brandTrend = [];
    Object.keys(brands).forEach(b => {
      const info = brands[b];
      if (info.cnt < 4) return;
      let f = 0, s = 0;
      months.forEach(mm => {
        const v = (brandMonth[b] || {})[mm] || 0;
        if (firstM.has(mm)) f += v; else if (secondM.has(mm)) s += v;
      });
      if (Math.max(f, s) < 2000) return;
      brandTrend.push({
        brand: b, cat: info.cat, first: r2(f), second: r2(s), delta: r2(s - f),
        pct: f > 0 ? r1((s - f) / f * 100) : null,
      });
    });
    brandTrend.sort((a, b) => b.delta - a.delta);

    // дубли
    const buckets = {};
    spend.forEach(r => {
      const key = r.b + "|" + Math.round(-r.a * 100);
      (buckets[key] = buckets[key] || []).push(r);
    });
    const dups = [];
    Object.keys(buckets).forEach(key => {
      const rows = buckets[key].sort((x, y) => x.t - y.t);
      const a = Math.round(-rows[0].a);
      for (let i = 1; i < rows.length; i++) {
        if ((rows[i].t - rows[i - 1].t) / DAY <= 2 && a >= 200) {
          dups.push({ id: rows[i].id, date: rows[i].iso, amount: a, brand: rows[i].b, cat: CATS[catOf(rows[i])], prev: rows[i - 1].iso });
        }
      }
    });
    dups.sort((a, b) => (a.date < b.date ? 1 : -1));

    // доходы / инвестиции / переводы
    const income = {}, invest = {}, p2p = {}, cash = {};
    inRange.forEach(r => {
      const mm = r.mm;
      if ((r.k === "in_in" || r.k === "salary" || r.k === "bonus" || r.k === "cashback" || r.k === "interest") && r.a > 0) income[mm] = (income[mm] || 0) + r.a;
      else if (r.k === "invest_out" || r.k === "invest_in") invest[mm] = (invest[mm] || 0) + -r.a;
      else if (r.k === "p2p" || r.k === "ext_bank") p2p[mm] = (p2p[mm] || 0) + -r.a;
      else if (r.k === "cash_out") cash[mm] = (cash[mm] || 0) + -r.a;
    });

    const reports = {};
    const brandNames = Object.keys(brandTotal);
    months.forEach(mm => {
      const cats = SPEND_CATS.map(c => [c, r2((monthCat[mm] || {})[c] || 0)]).sort((x, y) => y[1] - x[1]);
      const bs = brandNames.map(b => [b, r2((brandMonth[b] || {})[mm] || 0)]).sort((x, y) => y[1] - x[1]);
      reports[mm] = {
        spend: r2(monthTotal[mm] || 0), cnt: monthCnt[mm] || 0,
        check: monthCnt[mm] ? r2(monthTotal[mm] / monthCnt[mm]) : 0,
        income: r2(income[mm] || 0), invest: r2(invest[mm] || 0), p2p: r2(p2p[mm] || 0),
        top_cats: cats.slice(0, 4).filter(x => x[1] > 0),
        top_brands: bs.slice(0, 4).filter(x => x[1] > 0),
        anomalies: anomalies.filter(a => a.date.slice(0, 7) === mm).length,
      };
    });
    months.forEach((mm, i) => {
      const prev = i ? months[i - 1] : null;
      reports[mm].prev_spend = prev ? reports[prev].spend : null;
      reports[mm].delta = prev ? r2(reports[mm].spend - reports[prev].spend) : null;
    });

    const sumVals = o => r2(Object.keys(o).reduce((s, k) => s + o[k], 0));

    return {
      label: from === to ? "один день" : from + "…" + to,
      from, to, months, days,
      totals: {
        spend: r2(total), cnt: spend.length,
        avg: spend.length ? r2(total / spend.length) : 0,
        per_month: r2(total / perMonthDiv), per_year: r2(total / perMonthDiv * 12),
        income: sumVals(income), invest: sumVals(invest), p2p: sumVals(p2p), cash: sumVals(cash),
      },
      categories, brands, recurring, small: smallBlock,
      weekday, hours, moy: mood,
      anomalies: anomalies.slice(0, 40), biggest, spikes, brand_trend: brandTrend.slice(0, 25), dups: dups.slice(0, 30),
      reports,
      series: {
        total: months.map(mm => r2(monthTotal[mm] || 0)),
        income: months.map(mm => r2(income[mm] || 0)),
        invest: months.map(mm => r2(invest[mm] || 0)),
        p2p: months.map(mm => r2(p2p[mm] || 0)),
        cash: months.map(mm => r2(cash[mm] || 0)),
        check: months.map(mm => monthCnt[mm] ? r2(monthTotal[mm] / monthCnt[mm]) : 0),
        cnt: months.map(mm => monthCnt[mm] || 0),
      },
    };
  }

  function profileOf(b) {
    const tot = b.totals.spend;
    const regTotal = b.recurring.reduce((s, r) => s + r.yearly, 0);
    const brandTotals = Object.keys(b.brands).map(k => b.brands[k].total).sort((x, y) => y - x);
    const hhi = tot ? brandTotals.reduce((s, v) => s + (v / tot) ** 2, 0) * 10000 : 0;
    return {
      regular_share: tot ? r1(regTotal / tot * 100) : 0,
      variable_share: tot ? r1(100 - regTotal / tot * 100) : 0,
      regular_yearly: r2(regTotal),
      hhi: Math.round(hhi),
      top10_share: tot ? r1(brandTotals.slice(0, 10).reduce((s, v) => s + v, 0) / tot * 100) : 0,
      stability_cv: cv(b.series.total),
      avg_check: b.totals.avg,
      avg_check_median: r2(median(b.small ? [] : [])),
      uncategorized_share: b.categories["Прочее"] ? b.categories["Прочее"].share : 0,
      cash_share: tot ? r1(b.totals.cash / (tot + b.totals.cash) * 100) : 0,
    };
  }

  // средняя медиана чека отдельно (нужна профилю)
  function medianCheck(b) {
    const vals = [];
    b.__rows = null;
    return vals;
  }

  // ---- рекомендации -------------------------------------------------------
  const REC_DEFS = [
    { cat: "Продукты", pct: 10, title: "Сравнивать магазины внутри недели",
      why: "Основная категория. Разница между сетями и «магазином у дома» по одному и тому же набору доходит до 20–30%; 10% — осторожная оценка при сохранении привычного рациона.",
      confidence: "средняя", effort: "средняя" },
    { cat: "Кофе и фастфуд", pct: 25, title: "Сократить кофе и фастфуд на четверть",
      why: "Самая частая категория по количеству операций. Отказ от 1–2 покупок в неделю почти не меняет образ жизни, но экономит заметную сумму.",
      confidence: "высокая", effort: "низкая" },
    { cat: "Доставка еды", pct: 30, title: "Заменить часть доставки готовкой",
      why: "Средний чек доставки в несколько раз выше среднего чека продуктов. 30% заказов — реалистичная замена домашней едой.",
      confidence: "средняя", effort: "средняя" },
    { cat: "Ставки и азартные игры", pct: 100, title: "Разобраться с пополнениями ЦУПИС",
      why: "Платежи в НКО «Мобильная карта» — это единый ЦУПИС, через который пополняются счёта букмекеров и казино. Это не покупка товара: деньги уходят без возврата.",
      confidence: "средняя", effort: "низкая" },
    { cat: "Кикшеринг", pct: 25, title: "Меньше поездок на самокатах",
      why: "Очень много мелких поездок. Часть маршрутов в 1–2 км дешевле пройти пешком или проехать на общественном транспорте.",
      confidence: "средняя", effort: "низкая" },
    { cat: "Маркетплейсы", pct: 20, title: "Сократить импульсивные заказы",
      why: "Заказы с небольшим чеком и высокой частотой — типичный признак импульсивных покупок «на сдачу».",
      confidence: "средняя", effort: "средняя" },
    { cat: "Табак", pct: 100, title: "Отказ от табачных изделий",
      why: "Единственная категория, где полный отказ не ухудшает качество жизни, а расходы прекращаются полностью.",
      confidence: "высокая", effort: "средняя" },
    { cat: "Такси и каршеринг", pct: 20, title: "Сократить такси на 20%",
      why: "Поездки заметны в бюджете; часть можно заменить общественным транспортом.",
      confidence: "низкая", effort: "низкая" },
    { cat: "Подписки и сервисы", pct: 40, title: "Пересмотреть подписки",
      why: "Часть подписок могла стать неактуальной. Банковская выписка не доказывает, что сервис не используется, — это кандидаты на проверку.",
      confidence: "низкая", effort: "низкая" },
    { cat: "Комиссии банка", pct: 50, title: "Проверить банковские комиссии",
      why: "Платы за обслуживание и оповещения списываются регулярно; часть можно отключить.",
      confidence: "высокая", effort: "низкая" },
    { cat: "Прочее", pct: 10, title: "Разобрать нераспознанные траты",
      why: "Часть операций не удалось отнести к категории. Если отметить их вручную, точность остальных рекомендаций вырастет.",
      confidence: "низкая", effort: "низкая" },
  ];
  const CONF_W = { "высокая": 1.0, "средняя": 0.88, "низкая": 0.72 };
  const EFFORT_W = { "низкая": 1.0, "средняя": 0.95, "высокая": 0.85 };

  function buildRecs(b, stopped) {
    stopped = stopped || {};
    const monthsN = b.months.length || 1;
    const recs = REC_DEFS.map(def => {
      const k = b.categories[def.cat];
      if (!k) return null;
      const saveMonth = k.per_year / 12 * def.pct / 100;
      const isStopped = !!stopped[def.cat];
      const ids = Object.keys(b.brands)
        .filter(br => b.brands[br].cat === def.cat)
        .map(br => b.brands[br])
        .sort((x, y) => y.total - x.total)
        .slice(0, 3)
        .flatMap(x => x.ids.slice(-20));
      return {
        cat: def.cat, pct: def.pct, title: def.title, why: def.why,
        confidence: def.confidence, effort: def.effort,
        base_year: r2(k.per_year), base_month: r2(k.per_month),
        save_month: r2(saveMonth), save_year: r2(saveMonth * 12), save_5y: r2(saveMonth * 60),
        cnt_year: Math.round(k.cnt * 12 / monthsN), avg_check: k.avg,
        stopped: isStopped, stop_note: isStopped ? stopped[def.cat] : null,
        ids: ids.slice(0, 60),
      };
    }).filter(Boolean);

    recs.forEach(r => {
      const freq = Math.min(1, r.cnt_year / 120);
      r.score = r.stopped ? -1 : r2(r.save_year * CONF_W[r.confidence] * EFFORT_W[r.effort] * (0.9 + 0.2 * freq));
    });
    // прекращённые привычки не должны возглавлять список экономии
    recs.sort((a, b2) => b2.score - a.score);
    recs.forEach((r, i) => {
      r.rank = i + 1;
      if (r.stopped) r.priority = "низкий";
      else r.priority = i < 3 ? "высокий" : (i < 7 ? "средний" : "низкий");
    });
    return recs;
  }

  function totalSaving(recs) {
    return recs.reduce((s, r) => s + (r.stopped ? 0 : r.save_year), 0);
  }

  window.ENGINE = {
    ROWS, ALL_MONTHS, CATS, CAT, SPEND_CATS, CONSUMPTION,
    computeBlock, buildRecs, totalSaving, profileOf, median, cv, r1, r2,
  };
})();

<script>
/* Финансовый консультант — интерфейс */
(function () {
"use strict";

const F = window.FIN;
const M = F.meta;
/* ---------------------------------------------------------------
   Платные функции: пока выключены. Включать только вместе с VK Pay / оплатой
   на платформах vk.ru и m.vk.ru, и помнить про правило 5.4.1 — в мобильных
   приложениях iOS/Android интерфейса оплаты быть не должно.
   canSell() — единственное место, где проверяется, можно ли вообще показывать оплату.
   --------------------------------------------------------------- */
const PRO = {
  enabled: false,      // станет true, когда появятся платные функции и серверная проверка оплаты
  trialDays: 0,        // пробный период, если основная функциональность станет платной (правило 5.4.3)
  priceLabel: ""       // «99 ₽ в месяц» — текст, который увидит пользователь
};
function canSell() {
  const p = window.VKCTX || {};
  if (!PRO.enabled || !PRO.priceLabel) return false;
  return !p.isMobileApp;   // iOS/Android: оплаты не показываем
}

const HAS_DATA = !!(F.tx && F.tx.length);
const nf = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 });

const MONTHS_RU = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
const MONTHS_FULL = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];

const PALETTE = ["#1c6b58", "#b4552a", "#2f5f8f", "#a8791a", "#6b4c8a", "#3f7a4e",
                 "#a8322a", "#2a7d8f", "#8a6a3f", "#7d3f6b", "#4a6b2a", "#8f5a2a",
                 "#2f7f6f", "#6f5a2a", "#5a3f7d", "#8f2a4a", "#3a7a6a"];

function catColor(c) {
  const idx = M.categories.indexOf(c);
  if (c === "Прочее") return "#9d968a";
  if (c === "Комиссии банка") return "#8a857a";
  return PALETTE[Math.max(0, idx) % PALETTE.length];
}

function money(v, dec) {
  const n = Math.abs(v);
  const s = dec ? nf2.format(n) : nf.format(Math.round(n));
  return (v < 0 ? "−" : "") + s + " ₽";
}
function short(v) {
  const n = Math.abs(v);
  let s;
  if (n >= 1e6) s = (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(".", ",") + " млн";
  else if (n >= 1e3) s = (n / 1e3).toFixed(0) + " тыс";
  else s = nf.format(Math.round(n));
  return (v < 0 ? "−" : "") + s;
}
function pct(v, dec = 0) {
  if (v === null || v === undefined) return "—";
  return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(dec) + "%";
}
function monthLabel(mm, full) {
  const [y, m] = mm.split("-");
  const name = full ? MONTHS_FULL[+m - 1] : MONTHS_RU[+m - 1];
  return name + " " + y;
}
function fmtDate(iso) {
  if (!iso) return "—";
  return iso.slice(8, 10) + "." + iso.slice(5, 7) + "." + iso.slice(0, 4);
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function weekdayName(d) {
  return ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"][d];
}
function plural(n, one, few, many) {
  n = Math.abs(Math.round(n));
  if (n % 10 === 1 && n % 100 !== 11) return one;
  if (n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14)) return few;
  return many;
}

const E = window.ENGINE;

// пользователь подтвердил, что ставки прекращены: такие траты не входят в потенциал экономии
const STOPPED = {
  "Ставки и азартные игры": "ставки прекращены — по вашим словам, этих расходов больше не будет",
};

const LS_KEY = "fin.overrides.v1";
function loadOverrides() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { return {}; }
}
function saveOverrides(o) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) {}
}
const overrides = loadOverrides();

const ACTIVE_RANGE = { from: M.active[0], to: M.active[1] };
const FULL_RANGE = { from: M.period[0], to: M.period[1] };

const START_PAGE = HAS_DATA ? "overview" : "import";
const state = {
  page: START_PAGE,
  from: ACTIVE_RANGE.from,
  to: ACTIVE_RANGE.to,
  preset: "active",
  src: "all",
  txFilter: { cat: "all", brand: "all", q: "", min: 0, kind: "spend" },
  scen: { cats: new Set(), pct: 20 },
  cmpCat: null,
  reportMonth: null,
  reportCompare: null,
};

let _block = null, _blockKey = "";
function B() {
  const key = state.from + "|" + state.to + "|" + state.src + "|" + JSON.stringify(overrides);
  if (!_block || _blockKey !== key) {
    _block = E.computeBlock(state.from, state.to, overrides, state.src);
    _blockKey = key;
  }
  return _block;
}
function isFull() { return state.from === FULL_RANGE.from && state.to === FULL_RANGE.to; }
function DAYS() { return Math.round((new Date(state.to) - new Date(state.from)) / 86400000) + 1; }
function shortPeriod() { return DAYS() < 14; }

function isActive() { return state.from === ACTIVE_RANGE.from && state.to === ACTIVE_RANGE.to; }
function rangeDays() { return B().days; }

let _recsKey = "", _recsCache = null;
function RECS() {
  const key = _blockKey + "|" + state.page + "|" + state.src;
  if (!_recsCache || _recsKey !== key) {
    _recsCache = E.buildRecs(B(), STOPPED);
    _recsKey = key;
  }
  return _recsCache;
}
function totalSave() { return E.totalSaving(RECS()); }
function SCEN() {
  const b = B(), out = {};
  E.CONSUMPTION.forEach(c => {
    const k = b.categories[c];
    out[c] = { year: k.per_year, month: k.per_month, cnt: k.cnt };
  });
  return out;
}
function yearsList() {
  const ys = Object.keys(F.years).filter(y => F.years[y].spend > 0);
  return ys.length ? ys : Object.keys(F.years);
}

function presetRange(id) {
  if (/^\d{4}$/.test(id)) {
    const lo = M.period[0], hi = M.period[1];
    const from = id + "-01-01", to = id + "-12-31";
    return { from: from < lo ? lo : from, to: to > hi ? hi : to };
  }
  const maxISO = M.period[1];
  const now = maxISO;                      // «сегодня» по выписке
  const ym = now.slice(0, 7);
  const day = n => ym + "-" + String(n).padStart(2, "0");
  const shift = (iso, dm) => {
    const [y, m] = iso.split("-").map(Number);
    const d = new Date(Date.UTC(y, m - 1 + dm, 1));
    const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(last).padStart(2, "0");
  };
  switch (id) {
    case "active": return ACTIVE_RANGE;
    case "full": return FULL_RANGE;
    case "month": return { from: ym + "-01", to: maxISO };
    case "prev": return { from: shift(ym + "-01", -1).slice(0, 8) + "01", to: shift(ym + "-01", -1) };
    case "3m": return { from: shift(ym + "-01", -2).slice(0, 8) + "01", to: maxISO };
    case "year": return { from: "2026-01-01", to: maxISO };
    case "2025": return { from: "2025-01-01", to: "2025-12-31" };
    default: return { from: state.from, to: state.to };
  }
}

function setRange(from, to) {
  if (!from || !to) return;
  if (from > to) { const t = from; from = to; to = t; }
  const lo = M.period[0], hi = M.period[1];
  if (from < lo) from = lo;
  if (to > hi) to = hi;
  state.from = from;
  state.to = to;
  state.preset = "custom";
  if (from === ACTIVE_RANGE.from && to === ACTIVE_RANGE.to) state.preset = "active";
  if (from === FULL_RANGE.from && to === FULL_RANGE.to) state.preset = "full";
  state.reportMonth = null;
  state.reportCompare = null;
  render();
}

/* ------------------------------ SVG charts ------------------------------ */
function svgLine(values, labels, o) {
  o = o || {};
  const w = o.w || 760, h = o.h || 180, pl = 46, pr = 12, pt = 14, pb = 26;
  const max = Math.max.apply(null, values.concat([1])) * 1.12;
  const n = values.length;
  const X = i => pl + (n > 1 ? i * (w - pl - pr) / (n - 1) : 0);
  const Y = v => pt + (1 - v / max) * (h - pt - pb);
  let grid = "";
  for (let k = 0; k <= 3; k++) {
    const v = max * k / 3, y = Y(v);
    grid += `<line class="gridline" x1="${pl}" y1="${y.toFixed(1)}" x2="${w - pr}" y2="${y.toFixed(1)}"/>`;
    grid += `<text x="${pl - 7}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${short(v)}</text>`;
  }
  const pts = values.map((v, i) => [X(i), Y(v)]);
  let d = "";
  pts.forEach((p, i) => { d += (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); });
  const area = d + `L${pts[pts.length - 1][0].toFixed(1)} ${h - pb}L${pts[0][0].toFixed(1)} ${h - pb}Z`;
  let ticks = "";
  const step = o.tickEvery || Math.ceil(n / 8);
  labels.forEach((lb, i) => {
    const show = o.tickEvery ? !!lb : ((i % step === 0 || i === n - 1) && lb);
    if (show) {
      ticks += `<text x="${X(i).toFixed(1)}" y="${h - 8}" text-anchor="middle">${lb}</text>`;
    }
  });
  let dots = "";
  pts.forEach((p, i) => {
    dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="8" fill="transparent" class="pt" data-i="${i}">
      <title>${labels[i]}: ${money(values[i])}</title></circle>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">
    ${grid}
    <path d="${area}" fill="${o.fill || "rgba(28,107,88,.10)"}" stroke="none"/>
    <path d="${d}" fill="none" stroke="${o.color || "#1c6b58"}" stroke-width="2" stroke-linejoin="round"/>
    ${dots}${ticks}
  </svg>`;
}

function svgBars(values, labels, o) {
  o = o || {};
  const w = o.w || 760, h = o.h || 170, pl = 40, pr = 10, pt = 12, pb = 24;
  const max = Math.max.apply(null, values.concat([1])) * 1.12;
  const n = values.length;
  const gap = o.gap || 0.22;
  const bw = (w - pl - pr) / n * (1 - gap);
  const Y = v => pt + (1 - v / max) * (h - pt - pb);
  let grid = "";
  for (let k = 0; k <= 3; k++) {
    const v = max * k / 3, y = Y(v);
    grid += `<line class="gridline" x1="${pl}" y1="${y.toFixed(1)}" x2="${w - pr}" y2="${y.toFixed(1)}"/>`;
    grid += `<text x="${pl - 6}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${short(v)}</text>`;
  }
  let bars = "";
  values.forEach((v, i) => {
    const x = pl + i * (w - pl - pr) / n + ((w - pl - pr) / n - bw) / 2;
    const y = Y(v), bh = Math.max(1, h - pb - y);
    const col = o.colors ? o.colors[i] : (o.color || "#1c6b58");
    bars += `<rect class="bar" data-i="${i}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${col}">
      <title>${labels[i]}: ${money(v)}</title></rect>`;
  });
  let ticks = "";
  // на узком экране подписи сливаются: показываем каждую N-ю, последнюю — только если она не липнет к предыдущей
  const step = n <= 8 ? 1 : n <= 14 ? 2 : 3;
  let lastShown = -99;
  labels.forEach((lb, i) => {
    const isLast = i === n - 1;
    if (i % step !== 0 && !isLast) return;
    if (isLast && i - lastShown < step) return;
    lastShown = i;
    ticks += `<text x="${(pl + i * (w - pl - pr) / n + (w - pl - pr) / n / 2).toFixed(1)}" y="${h - 7}" text-anchor="middle">${lb}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${grid}${bars}${ticks}</svg>`;
}

function donut(items, total) {
  const w = 210, h = 210, r = 82, cx = w / 2, cy = h / 2, sw = 26;
  let a0 = -Math.PI / 2, paths = "";
  items.forEach(it => {
    const frac = total ? it.value / total : 0;
    const a1 = a0 + frac * Math.PI * 2;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    if (frac > 0.001) {
      paths += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}"
        fill="none" stroke="${it.color}" stroke-width="${sw}"><title>${it.label}: ${money(it.value)} (${(frac * 100).toFixed(1)}%)</title></path>`;
    }
    a0 = a1;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="max-width:260px;margin:0 auto">${paths}
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" style="font-size:11px;fill:#8a857a">всего</text>
    <text x="${cx}" y="${cy + 15}" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#191813">${short(total)}</text></svg>`;
}

function hbars(rows, opts) {
  opts = opts || {};
  const max = Math.max.apply(null, rows.map(r => r.value).concat([1]));
  return `<div class="hbar-list">` + rows.map(r => `
    <div class="hbar-row ${r.click ? "clickable" : ""}" ${r.click ? `data-act="${r.click}"` : ""}>
      <div class="hbar-top"><span>${r.label}${r.sub ? ` <span class="t-muted t-small">${r.sub}</span>` : ""}</span>
      <span class="t-muted">${opts.fmt ? opts.fmt(r.value) : money(r.value)}</span></div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(2, r.value / max * 100).toFixed(1)}%;background:${r.color || "#1c6b58"}"></div></div>
    </div>`).join("") + `</div>`;
}

function note(text, cls, ico) {

function yearsBefore2025() {
  return ["2020", "2021", "2022", "2023", "2024"].reduce((a, y) => {
    const v = F.years[y] || { spend: 0, cnt: 0 };
    return { spend: a.spend + v.spend, cnt: a.cnt + v.cnt };
  }, { spend: 0, cnt: 0 });
}

function srcTotals(src, y1, y2) {
  let spend = 0, cnt = 0;
  for (const t of F.tx) {
    const srcIdx = t[8] || 0;
    if (src === "tb" && srcIdx !== 0) continue;
    if (src === "sber" && srcIdx !== 1) continue;
    const y = +t[0].slice(0, 4);
    if (y < y1 || y > y2) continue;
    if (t[3] < 0 && (t[6] === "purchase" || t[6] === "fee")) { spend -= t[3]; cnt++; }
  }
  return { spend, cnt };
}

function ruDate(iso) {
  if (!iso) return "—";
  const m = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  const d = +iso.slice(8, 10), mo = +iso.slice(5, 7), y = iso.slice(0, 4);
  return `${d} ${m[mo - 1]} ${y}`;
}
function srcFrom(srcId) {
  const first = (F.tx || []).filter(t => (srcId === "sber" ? t[8] === 1 : t[8] === 0)).map(t => t[0]).sort();
  return first.length ? first[0] : "";
}

function lastBetDate() {
  const iso = (F.tx || []).filter(t => M.categories[t[5]] === "Ставки и азартные игры").map(t => t[0]).sort();
  return iso.length ? fmtDate(iso[iso.length - 1]) : "";
}

function bindImport() {
  const dz = document.getElementById("dropzone");
  const input = document.getElementById("fileInput");
  const st = document.getElementById("importStatus");
  if (input) input.addEventListener("change", () => {
    if (input.files && input.files[0]) handleImportFile(input.files[0]);
  });
  const jinput = document.getElementById("jsonInput");
  if (jinput) jinput.addEventListener("change", () => {
    if (jinput.files && jinput.files[0]) importData(jinput.files[0]);
  });
  if (!dz) return;
  ["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); dz.classList.add("over");
  }));
  ["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); dz.classList.remove("over");
  }));
  dz.addEventListener("drop", e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleImportFile(f);
  });
  if (st && !st.textContent.trim()) st.textContent = "файл ещё не загружен";
}

async function handleImportFile(file) {
  const st = () => document.getElementById("importStatus");
  const say = (t) => { const el = st(); if (el) el.textContent = t; };
  if (!/\.pdf$/i.test(file.name)) { say("нужен файл PDF"); return; }
  say("читаю файл: " + file.name + " (" + Math.round(file.size / 1024) + " КБ)");
  try {
    const buf = await file.arrayBuffer();
    const res = await IMPORT.importFile(buf, say);
    say("сохраняю…");
    const key = res.bank === "sber" ? 1 : 0;
    let fin = res.fin;
    let sources = [{ id: res.bank === "sber" ? "sber" : "tb", name: res.bank === "sber" ? "Сбер" : "Т-Банк", card: "" }];
    try {
      const prevRaw = localStorage.getItem("fin.dataset.v1");
      if (prevRaw) {
        const prev = JSON.parse(prevRaw);
        const other = (prev.tx || []).filter(t => t[8] !== key);
        if (other.length) {
          const merged = other.concat(res.fin.tx);
          const prevSrc = (prev.meta.sources || []).filter(s => s.id !== sources[0].id);
          fin = IMPORT.rebuild(merged, sources.concat(prevSrc));
        }
      }
    } catch (e) { }
    const raw = JSON.stringify(fin);
    try {
      localStorage.setItem("fin.dataset.v1", raw);
    } catch (e) {
      say("файл разобран, но не помещается в хранилище браузера (" + Math.round(raw.length / 1024) + " КБ). Показываю без сохранения.");
      window.FIN = fin;
      state.page = "overview"; render();
      return;
    }
    say("готово: " + nf.format(fin.tx.length) + " операций, обновляю страницу…");

const DATA_KEYS = ["fin.dataset.v1", "fin.overrides.v1", "fin.mydata.v1", "fin.split.v1", "fin.savings.v1"];

function exportData() {
  const out = { app: "finansovyj-konsultant", v: 1, at: new Date().toISOString(), data: {} };
  DATA_KEYS.forEach(k => {
    const raw = localStorage.getItem(k);
    if (raw == null) return;
    try { out.data[k] = JSON.parse(raw); } catch (e) { out.data[k] = raw; }
  });
  const blob = new Blob([JSON.stringify(out)], { type: "application/json" });
  const a = document.createElement("a");
  const d = new Date();
  const p2 = n => String(n).padStart(2, "0");
  a.href = URL.createObjectURL(blob);
  a.download = `finansy-${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  say2("файл сохранён — теперь его можно загрузить на другом устройстве");
}

function say2(t) {
  const el = document.getElementById("jsonStatus");
  if (el) el.textContent = t;
}

function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(String(fr.result));
      const data = (obj && obj.data) || obj;
      let n = 0;
      DATA_KEYS.forEach(k => {
        if (!data || !(k in data)) return;
        const v = data[k];
        localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
        n++;
      });
      if (!n) { say2("в файле нет данных этого приложения"); return; }
      say2("загружено, обновляю страницу…");
      setTimeout(() => location.reload(), 700);
    } catch (e) {
      say2("не удалось прочитать файл: " + (e && e.message ? e.message : e));
    }
  };
  fr.readAsText(file);
}
